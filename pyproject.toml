[project]
name = "misp-stix"
version = "2026.10.12"
description = "Python scripts used by MISP to export MISP format into STIX and to import STIX into MISP format."
authors = [
    {name = "Christian Studer", email = "christian.studer@circl.lu"}
]
maintainers = [
    {name = "Christian Studer", email = "christian.studer@circl.lu"}
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.11,<3.16"

dynamic = [ "classifiers" ]

dependencies = [
    "pymisp (>=3.0.0,<4.0.0)",
    "stix (>=1.2.0.11,<2.0.0)",
    "cybox (>=2.1.0.21,<3.0.0)",
    "mixbox (>=1.0.5,<2.0.0)",
    "maec (>=4.1.0.17,<5.0.0)",
    "stix-edh (==1.0.3)",
    "setuptools (>=83)",
    "pycountry (>=26.2.16,<27.0.0)",
    "stix2 (>=3.0.2,<4.0.0)"
]

[project.urls]
repository = "https://github.com/MISP/misp-stix"
issues = "https://github.com/MISP/misp-stix/issues"
documentation = "https://misp.github.io/misp-stix/"

[project.scripts]
misp_stix_converter = "misp_stix_converter:main"

[tool.poetry]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Operating System :: POSIX :: Linux',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Information Technology',
    'Topic :: Security'
]

packages = [
    { include = "misp_stix_converter" }
]

# The galaxy trees are generated into the package directory and may sit in a
# checkout, but they are not part of the library: without this the build
# sweeps them into the wheel, since they are not ignored either.
exclude = [
    "misp_stix_converter/data/STIX_2*"
]

[tool.poetry.group.dev.dependencies]
flake8 = "^7.4.1"
pytest = "^9.0.3"
jsonschema = "^4.26.0"

[build-system]
requires = ["poetry-core>=2.0", "setuptools>=83"]
build-backend = "poetry.core.masonry.api"
